<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome Greeting Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <div class="card">
      <header class="card-header">
        <div class="icon-wrapper">
          <span class="wave-icon">👋</span>
        </div>
        <h1>Welcome!</h1>
        <p class="subtitle">Please enter your name below to get your personalized greeting.</p>
      </header>

      <!-- Input Form -->
      <form id="greetingForm" class="greeting-form" novalidate>
        <div class="form-group">
          <label for="nameInput">Your Name</label>
          <div class="input-wrapper">
            <input 
              type="text" 
              id="nameInput" 
              name="userName" 
              placeholder="e.g. Alex Smith" 
              autocomplete="name"
              autofocus
            >
          </div>
          <p id="errorMessage" class="error-message" role="alert" aria-live="polite"></p>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary">
          <span>Say Hello</span>
          <svg class="arrow-icon" viewBox="0 0 20 20" fill="currentColor" width="18" height="18">
            <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
          </svg>
        </button>
      </form>

      <!-- Welcome Message Output Area -->
      <section id="greetingResult" class="greeting-result hidden" aria-live="polite">
        <div class="result-badge">✨ Special Greeting ✨</div>
        <h2 id="greetingTitle" class="greeting-title"></h2>
        <p id="greetingText" class="greeting-text"></p>
        <button type="button" id="resetBtn" class="btn btn-secondary">
          <span>Enter another name</span>
        </button>
      </section>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
